[project]
name = "scilib-mcp"
version = "0.1.0"
description = "MCP server for open-access scientific literature: search, legal full-text retrieval with provenance, and full-text search over papers you already hold"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp", "httpx"]

[project.scripts]
scilib-mcp = "scilib.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scilib*"]
